name: Deploy release to GitHub Pages

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0

      - name: Verify release tag and source branch
        run: |
          node tests/release/checkVersion.js "$GITHUB_REF_NAME"
          git fetch --no-tags origin main:refs/remotes/origin/main
          release_commit="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          git merge-base --is-ancestor "$release_commit" origin/main

      - name: Enable Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Verify runtime versions
        run: |
          test "$(node --version)" = "v22.12.0"
          test "$(yarn --version)" = "1.22.22"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install Chromium
        run: yarn playwright install --with-deps --only-shell chromium

      - name: Run quality checks and build
        run: yarn quality

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
